name: CI - Build and Test

on:
    push:
      branches:["main"]
    pull_request:
      branches:["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    -name: Setup .NET 9
     uses: actions/setup-dotnet@v4
     with:
        dotnet-version: '9.0.x'

    -name: Restore dependencies
     run: dotnet restore Todo_Application.sln

    -name: build
     run: dotnet restore Todo_Application.sln --no-restore -c Release

    -name: Run Tests
     run: dotnet test Todo_Application.sln --no-build -c Release --verbosity normal

build-and-push:
    needs:build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents : read
      packages: write
    steps:
      -name: Checkout code
       uses: actions/checkout@v4

      -name: Log in to Github Container Registry
       uses: docker/login-action@v3
       with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}

      -name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v3
      
      -name: build and push Docker image
       uses: docker/build-push-action@v6
       with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{github.repository_owner}}/todo_application:latest
          ghcr.io/${{github.repository_owner}}/todo_application:${{github.sha}}
